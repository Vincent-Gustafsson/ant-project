[package]
name = "ant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
colonyos = "1.0.5"
confy = { version = "2.0.0", default-features = false, features = ["yaml_conf"] }
git2 = "0.20.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = "1.50.0"
reqwest = { version = "0.13.2", features = ["json"] }
flate2 = "1.1.9"
tar = "0.4.45"
bytes = "1.11.1"
tera = "1.20.1"
