# .github/workflows/release.yml
name: release

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: build ${{ matrix.target }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-musl
                      asset: node-agent-linux-amd64
                    - target: aarch64-unknown-linux-musl
                      asset: node-agent-linux-arm64
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install cross
              run: cargo install cross --locked

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              run: cross build --release --locked --target ${{ matrix.target }} --bin node-agent

            - name: Stage binary
              run: |
                  mkdir -p dist
                  cp target/${{ matrix.target }}/release/node-agent dist/${{ matrix.asset }}
                  (cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256)

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset }}
                  path: dist/*

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: latest
                  files: dist/*
                  make_latest: "true"
