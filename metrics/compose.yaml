services:
    questdb:
        image: questdb/questdb:8.2.1
        ports:
            - "9000:9000"
            - "9009:9009"
            - "8812:8812"
        volumes:
            - questdb_data:/var/lib/questdb
        restart: unless-stopped
        logging:
            driver: "none"

    backend:
        build: ./backend
        ports:
            - "3000:3000"
        environment:
            - QUESTDB_HOST=questdb
            - QUESTDB_PG_PORT=8812
        depends_on:
            questdb:
                condition: service_started
        restart: unless-stopped

    collector:
        build: ./collector
        environment:
            - QUESTDB_HOST=questdb
            - QUESTDB_ILP_PORT=9009
        depends_on:
            questdb:
                condition: service_started
        restart: unless-stopped

volumes:
    questdb_data:
